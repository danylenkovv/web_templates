<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Note List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js"></script>
</head>
<body class="container my-5">
<form name="note_form" class="form-inline mb-3">
    <div class="d-flex w-100">
        <input type="text" name="note" class="form-control flex-fill mr-2" placeholder="Enter a note"/>
        <input type="button" name="add" value="Add" class="btn btn-primary"/>
    </div>
</form>
<table id="notes" class="table table-striped border">
    <thead class="thead-dark">
    <tr>
        <th>#</th>
        <th>Note</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>
<div id="editModal" class="modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Note</h5>
                <span class="close" aria-label="Close">&times;</span>
            </div>
            <div class="modal-body">
                <form id="edit_form">
                    <input type="text" name="edit_note" class="form-control mb-2"/>
                    <input type="button" value="Save" id="save_edit" class="btn btn-success w-100"/>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
