<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary-subtle">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body">
                    <h3 class="card-title text-center mt-3">Register With Us</h3>
                    <form id="registrationForm" action="#" method="post" novalidate>
                        <div class="m-3 mt-4">
                            <label for="username" class="form-label text-secondary">Username</label>
                            <input type="text" name="username" class="form-control p-3" id="username"
                                   placeholder="Enter username">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="m-3 mt-4">
                            <label for="email" class="form-label text-secondary">Email</label>
                            <input type="email" name="email" class="form-control p-3" id="email"
                                   placeholder="Enter email">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="m-3 mt-4">
                            <label for="password" class="form-label text-secondary">Password</label>
                            <input type="password" name="password" class="form-control p-3" id="password"
                                   placeholder="Enter password">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="m-3 mt-4">
                            <label for="confirmPassword" class="form-label text-secondary">Confirm Password</label>
                            <input type="password" name="password_confirm" class="form-control p-3" id="confirmPassword"
                                   placeholder="Enter password again">
                            <div class="invalid-feedback"></div>
                        </div>
                        <div class="d-grid m-3 mt-5">
                            <button type="submit" class="btn btn-primary p-3">Submit</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="scripts.js"></script>
</body>
</html>
